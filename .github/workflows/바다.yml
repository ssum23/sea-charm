# 바다 정보(수온·파고·바람)를 15분마다 받아서 `data` 가지에 올린다.
#
# 🔴 `main` 이 아니라 `data` 가지에 올리는 이유 —
#    `main` 에 올리면 배포가 다시 돌고 판 번호가 바뀐다.
#    그러면 사용자들이 15분마다 4MB를 다시 받는다. 그건 배 위에서 손해다.
#
# 🔵 앱은 이 파일을 raw.githubusercontent.com 에서 바로 읽는다. 중계 서버가 필요 없다.

name: 바다정보

on:
  schedule:
    # 🔴 2026-08-13 고침 — 15분마다에서 30분마다로 늦췄다.
    #    ① 수온·파고는 15분마다 안 바뀐다(관측 자체가 보통 한 시간 간격이다)
    #    ② 공공데이터포털에는 하루 호출 한도가 있다. 관측소를 늘렸으니
    #       15분마다 × 관측소 수로 하루 수천 번이 되어 한도를 넘길 수 있다
    - cron: '*/30 * * * *'   # 30분마다 (세계표준시 기준이지만 간격이라 상관없다)
  workflow_dispatch:          # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: sea-info
  cancel-in-progress: true

jobs:
  # ⚠️ 작업의 이름표(sea)는 깃허브가 **영문만** 받는다.
  #    한글로 두면 워크플로 파일 자체를 못 읽어 `-1s` 로 바로 실패한다.
  #    (2026-08-06 배포.yml 에서 겪었고, 2026-08-13 여기서 또 겪었다)
  #    화면에 보이는 이름은 아래 name: 이다.
  sea:
    name: 바다 받기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공공데이터포털에서 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node .github/scripts/바다받기.mjs

      # 🔴 2026-08-14 — 진단 파일도 같이 올린다.
      #    바다.json 은 「못 받으면 안 만든다」(먼저 것을 안 덮으려고).
      #    🔵 그런데 **진단은 못 받았을 때가 가장 필요하다.** 그래서 따로 다룬다.
      #    진단.json 은 앱이 안 읽는다 — 우리가 읽는 파일이다.
      - name: data 가지에 올리기
        run: |
          if [ ! -f 바다자료/바다.json ] && [ ! -f 바다자료/진단.json ]; then
            echo "받은 게 없습니다 — 올리지 않습니다."
            exit 0
          fi
          git config user.name "sea-charm bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f 바다자료/바다.json ] && cp 바다자료/바다.json /tmp/바다.json
          [ -f 바다자료/진단.json ] && cp 바다자료/진단.json /tmp/진단.json
          git fetch origin data --depth 1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          # 🔴 바다.json 은 있을 때만 덮는다 — 없으면 먼저 받아둔 것이 그대로 남는다
          if [ -f /tmp/바다.json ]; then cp /tmp/바다.json 바다.json; git add -f 바다.json; fi
          if [ -f /tmp/진단.json ]; then cp /tmp/진단.json 진단.json; git add -f 진단.json; fi
          if git diff --cached --quiet; then
            echo "바뀐 게 없습니다."
          else
            git commit -m "바다 정보 갱신"
            git push origin data --force
          fi
